<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-weight:800;font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
nav{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:18px}

.card .w{font-size:2.2rem;font-weight:800;letter-spacing:-.01em}
.card .t{color:var(--mute);font-size:.9rem;margin-top:8px}
.row{display:flex;gap:10px;margin-top:14px}
.row button,.btn{flex:1;font:600 16px inherit;font-family:inherit;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.row .yes{background:var(--ok);color:#fff;border-color:var(--ok)}
.row .no{background:var(--bad);color:#fff;border-color:var(--bad)}

.q{font-size:1.5rem;font-weight:600;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 17px inherit;font-family:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.fb{min-height:3em;color:var(--mute);margin:8px 0}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .25s}
.end{text-align:center;padding:30px 10px}.end b{font-size:2.4rem;display:block}
.ref{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:.92rem;color:var(--mute)}
.row .spk{flex:0 0 auto;padding:13px 16px}

.tb{width:100%;border-collapse:collapse;margin:10px 0;font-size:.93rem}.tb td,.tb th{border:1px solid var(--line);padding:6px 8px;text-align:left}.tb th{color:var(--mute);font-weight:600}
.lk{display:block;padding:9px 0;color:var(--acc);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}.lk:last-of-type{border-bottom:0}
.say{border-bottom:1.5px dotted var(--acc);color:var(--acc);font-weight:600;cursor:pointer}

.vt[aria-pressed=false]{color:var(--mute);text-decoration:line-through}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
